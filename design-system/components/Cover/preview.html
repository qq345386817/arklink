<div style="width:960px;height:288px;position:relative;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-sans)">
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true" style="position:absolute;inset:0">
    <!-- Blocks: primary 192x192, risk 96x96, surface-strong 144x192. Alignment: right-hand dossier grid. Pattern: four horizontal evidence rules, technical mono case-file identity. Scale: space-3=24, space-6=48; radius-sm=4. -->
    <style>.brand{fill:var(--primary)}.amber{fill:var(--risk)}.panel{fill:var(--surface-strong)}.rule{stroke:var(--bg);stroke-width:4}.tile{rx:var(--radius-sm)}</style>

  </svg>
  <div style="position:absolute;left:32px;bottom:72px;font-size:64px;font-weight:800;line-height:.95">ArkLink<br>Field Notes</div>
  <p style="position:absolute;left:32px;bottom:32px;margin:0;font-size:14px;color:var(--muted)">Field Notes / Decisions leave a record.</p>
</div>
